name: Refresh disposable email blocklist

on:
  schedule:
    # 2:17 AM UTC on the 1st of every month. Odd-minute schedule avoids the
    # top-of-the-hour congestion on GitHub Actions runners.
    - cron: '17 2 1 * *'
  workflow_dispatch: # manual trigger from the Actions tab

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch upstream blocklist
        run: |
          set -euo pipefail
          UPSTREAM="https://raw.githubusercontent.com/disposable-email-domains/disposable-email-domains/main"
          curl -fsSL "$UPSTREAM/disposable_email_blocklist.conf" -o /tmp/blocklist.conf
          echo "Fetched $(wc -l < /tmp/blocklist.conf) blocklist lines"

      - name: Regenerate src/data/disposable-email-domains.js
        run: |
          node scripts/build-disposable-list.mjs \
            /tmp/blocklist.conf \
            src/data/disposable-email-domains.js

      - name: Verify Astro build still passes with new list
        run: |
          npm ci
          npm run build

      - name: Open pull request if blocklist changed
        id: create-pr
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'chore: refresh disposable email blocklist'
          title: 'Refresh disposable email blocklist'
          body: |
            Automated refresh of `src/data/disposable-email-domains.js` from upstream
            [disposable-email-domains/disposable-email-domains](https://github.com/disposable-email-domains/disposable-email-domains).

            **Auto-merge is enabled.** This PR will squash-merge automatically once
            CI passes. The Astro build already ran successfully before this PR was
            created, so unless you've added branch protection rules with extra
            required checks, the merge fires immediately.

            If anything looks off, disable auto-merge or close the PR — the next
            scheduled run will recreate it from current upstream.
          branch: chore/refresh-disposable-blocklist
          base: main
          delete-branch: true
          labels: |
            automated
            dependencies

      - name: Enable auto-merge on the PR
        if: steps.create-pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge \
            --auto \
            --squash \
            --repo "${{ github.repository }}" \
            "${{ steps.create-pr.outputs.pull-request-number }}"
